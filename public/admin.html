<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Admin Panel - SnapPro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .admin-container { max-width: 700px; margin: 40px auto; padding: 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .admin-header h2 { font-size: 1.5rem; font-weight: 800; }
        .logout-btn { background: #fee2e2; color: #ef4444; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
        .logout-btn:hover { background: #ef4444; color: #fff; }
        .admin-box { background: var(--card-bg); padding: 30px; border-radius: 20px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); margin-bottom: 30px; }
        .admin-box h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
        .form-control { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; outline: none; background: var(--surface); color: var(--text); font-family: inherit; transition: 0.2s; }
        .form-control:focus { border-color: var(--text); background: var(--bg); }
        .file-input-wrapper { border: 2px dashed var(--border); padding: 30px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.2s; background: var(--surface); }
        .file-input-wrapper:hover { border-color: var(--primary); background: #fffbeb; }
        input[type="file"] { display: none; }
        .btn-submit { background: var(--text); color: var(--bg); width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-submit:hover { background: var(--text-muted); transform: translateY(-2px); }
        .progress-container { margin-top: 20px; display: none; }
        .progress-text { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: var(--text); }
        .progress-bg { width: 100%; height: 10px; background: var(--border); border-radius: 10px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: var(--primary); border-radius: 10px; transition: width 0.2s ease; }
        .alert { padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; margin-bottom: 20px; display: none; text-align: center; }
        .alert-success { background: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0; }
        .alert-error { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
        .version-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: var(--surface); }
        .version-info { display: flex; flex-direction: column; }
        .version-name { font-weight: 700; font-size: 0.95rem; }
        .version-meta { font-size: 0.8rem; color: var(--text-muted); }
        .btn-delete { background: #fee2e2; color: #ef4444; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; transition: 0.2s; }
        .btn-delete:hover { background: #ef4444; color: #fff; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h2>Admin Dashboard</h2>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
        <div id="statusAlert" class="alert"></div>
        <div class="admin-box">
            <h3>Upload New Version</h3>
            <form id="uploadForm" enctype="multipart/form-data">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>Version (e.g. 1.0.0)</label>
                        <input type="text" name="version" class="form-control" placeholder="1.0.1" required>
                    </div>
                    <div class="form-group">
                        <label>File Size (e.g. 90 MB)</label>
                        <input type="text" name="size" class="form-control" placeholder="95 MB" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Device Support (Optional)</label>
                    <input type="text" name="device" class="form-control" placeholder="Android 8.0+">
                </div>
                <div class="form-group">
                    <label>Select APK File</label>
                    <label for="apkfile" class="file-input-wrapper" id="dropZone">
                        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 10px; color: var(--text-muted);"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        <div id="fileName" style="color: var(--text-muted); font-weight: 600;">Click to select .apk file</div>
                    </label>
                    <input type="file" name="apkfile" id="apkfile" accept=".apk" required>
                </div>
                <div class="progress-container" id="progressContainer">
                    <div class="progress-text">
                        <span id="progressStatus">Uploading...</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-text" style="margin-top: 4px;">
                        <span id="progressMb" style="font-size: 0.75rem; color: var(--text-muted);">0 MB / 0 MB</span>
                    </div>
                    <div class="progress-bg"><div class="progress-bar" id="progressBar"></div></div>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">Publish App</button>
            </form>
        </div>
        <div class="admin-box">
            <h3>Manage Versions</h3>
            <div id="app-list-container">
                <p style="color: var(--text-muted); font-size: 0.9rem;">Loading versions...</p>
            </div>
        </div>
    </div>
    <script>
        const fileInput = document.getElementById('apkfile');
        const fileName = document.getElementById('fileName');

        fileInput.addEventListener('change', function() {
            if (this.files && this.files.length > 0) {
                fileName.textContent = this.files[0].name;
                fileName.style.color = '#FACC15';
            }
        });

        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const progressMb = document.getElementById('progressMb');
        const progressStatus = document.getElementById('progressStatus');
        const statusAlert = document.getElementById('statusAlert');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(form);
            const xhr = new XMLHttpRequest();

            submitBtn.disabled = true;
            submitBtn.textContent = 'Uploading...';
            statusAlert.style.display = 'none';
            progressContainer.style.display = 'block';
            
            xhr.upload.addEventListener('progress', function(event) {
                if (event.lengthComputable) {
                    const percentComplete = Math.round((event.loaded / event.total) * 100);
                    const mbLoaded = (event.loaded / (1024 * 1024)).toFixed(2);
                    const mbTotal = (event.total / (1024 * 1024)).toFixed(2);
                    progressBar.style.width = percentComplete + '%';
                    progressPercent.textContent = percentComplete + '%';
                    progressMb.textContent = `${mbLoaded} MB / ${mbTotal} MB`;
                    if (percentComplete === 100) progressStatus.textContent = 'Processing on server...';
                }
            });

            xhr.onload = function() {
                progressContainer.style.display = 'none';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Publish App';

                if (xhr.status === 200) {
                    try {
                        const response = JSON.parse(xhr.responseText);
                        if (response.success) {
                            statusAlert.className = 'alert alert-success';
                            statusAlert.textContent = '✅ ' + response.message;
                            statusAlert.style.display = 'block';
                            form.reset();
                            fileName.textContent = 'Click to select .apk file';
                            fileName.style.color = 'var(--text-muted)';
                            loadAdminApps();
                        } else {
                            statusAlert.className = 'alert alert-error';
                            statusAlert.textContent = '❌ Error: ' + response.message;
                            statusAlert.style.display = 'block';
                        }
                    } catch (err) {
                        statusAlert.className = 'alert alert-error';
                        statusAlert.textContent = '❌ Server returned invalid response.';
                        statusAlert.style.display = 'block';
                    }
                } else {
                    statusAlert.className = 'alert alert-error';
                    statusAlert.textContent = '❌ Upload failed. Error: ' + xhr.status;
                    statusAlert.style.display = 'block';
                }
            };
            xhr.open('POST', '/snap-admin/upload', true);
            xhr.send(formData);
        });

        async function loadAdminApps() {
            const container = document.getElementById('app-list-container');
            try {
                const res = await fetch('/api/apps');
                const apps = await res.json();
                if (apps.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No versions uploaded yet.</p>';
                    return;
                }
                container.innerHTML = '';
                apps[0].versions.forEach(v => {
                    const vDiv = document.createElement('div');
                    vDiv.className = 'version-item';
                    
                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'version-info';
                    
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'version-name';
                    nameSpan.textContent = `v${v.version}`;
                    
                    const metaSpan = document.createElement('span');
                    metaSpan.className = 'version-meta';
                    metaSpan.textContent = `${v.size} • ${v.date}`;
                    
                    infoDiv.appendChild(nameSpan);
                    infoDiv.appendChild(metaSpan);
                    
                    const deleteForm = document.createElement('form');
                    deleteForm.action = "/snap-admin/delete-version";
                    deleteForm.method = "POST";
                    deleteForm.onsubmit = () => confirm('Delete this version?');
                    deleteForm.style.margin = '0';
                    
                    const hiddenInput = document.createElement('input');
                    hiddenInput.type = 'hidden';
                    hiddenInput.name = 'filename';
                    hiddenInput.value = v.filename;
                    
                    const delBtn = document.createElement('button');
                    delBtn.type = 'submit';
                    delBtn.className = 'btn-delete';
                    delBtn.textContent = 'Delete';
                    
                    deleteForm.appendChild(hiddenInput);
                    deleteForm.appendChild(delBtn);
                    
                    vDiv.appendChild(infoDiv);
                    vDiv.appendChild(deleteForm);
                    container.appendChild(vDiv);
                });
            } catch (error) {
                container.innerHTML = '<p style="color: #ef4444; font-size: 0.9rem;">Failed to load apps.</p>';
            }
        }
        document.addEventListener('DOMContentLoaded', loadAdminApps);
    </script>
</body>
</html>
